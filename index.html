<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Final ME315</title>
    
    <!-- SDK oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- ESTILOS GERAIS & PALETA PASTEL --- */
        :root {
            --bg-color: #fbf9f5;         /* Creme bem suave */
            --card-bg: #ffffff;          /* Branco limpo */
            --text-main: #4a4a4a;        /* Cinza escuro macio */
            --text-muted: #8c8c8c;       /* Cinza médio */
            --accent-green: #a8c3b2;     /* Verde-sálvia pastel */
            --accent-green-hover: #96b3a0;
            --accent-pink: #f4dcd6;      /* Rosa-seco pastel */
            --border-color: #eee9e0;     /* Borda sutil */
            --error-color: #e5989b;      /* Vermelho pastel para avisos */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- REGRA DE TELA OCULTA --- */
        .hidden {
            display: none !important;
        }

        /* --- CARDS & CONTAINER --- */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        }

        .app-card {
            max-width: 600px;
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 {
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* --- FORMULÁRIOS & CAMPOS --- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #faf9f6;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-green);
        }

        /* --- BOTÕES --- */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-green);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-secondary {
            background-color: var(--accent-pink);
            color: var(--text-main);
        }

        /* --- MENSAGENS DE ERRO --- */
        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        /* --- LAYOUT DO APP --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .app-header h2 {
            margin-bottom: 0;
        }

        .badge {
            background-color: var(--accent-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .content-box {
            background-color: #faf9f6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <!-- TELA 1: AUTENTICAÇÃO / LOGIN -->
    <section id="authView" class="card">
        <h2>Bem-vindo</h2>
        <p>Insira suas credenciais para acessar.</p>

        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn">Entrar</button>
        </form>
    </section>

    <!-- TELA 2: APLICAÇÃO (Inicia oculta com .hidden) -->
    <div id="appView" class="card app-card hidden">
        <div class="app-header">
            <div>
                <h2>Painel Principal</h2>
                <span class="badge">Online</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary" style="width: auto; padding: 6px 16px;">Sair</button>
        </div>
        
        <div class="content-box">
            <h3>Login realizado com sucesso!</h3>
            <p style="margin-bottom: 0; margin-top: 8px;">Conectado como: <strong id="userEmail">...</strong></p>
        </div>
    </div>

    <!-- CÓDIGO JAVASCRIPT / SUPABASE -->
    <script>
        // =========================================================================
        // Configuração do Supabase
        // =========================================================================
        const SUPABASE_URL = '!!! TROCA AQUI SEU SUPABASE URL !!!';
        const SUPABASE_KEY = '!!! TROCA AQUI SUA CHAVE ANON/PUBLIC KEY !!!';

        // Inicializa o cliente do Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Referências dos elementos na tela
        const authView = document.getElementById('authView');
        const appView = document.getElementById('appView');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const errorMessage = document.getElementById('errorMessage');
        const userEmailSpan = document.getElementById('userEmail');

        // =========================================================================
        // 1. Função para trocar as telas
        // =========================================================================
        function showAppView(email) {
            userEmailSpan.textContent = email;
            authView.classList.add('hidden');
            appView.classList.remove('hidden');
        }

        function showAuthView() {
            authView.classList.remove('hidden');
            appView.classList.add('hidden');
        }

        // =========================================================================
        // 2. Verificar se a pessoa já está logada ao carregar a página
        // =========================================================================
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                showAppView(session.user.email);
            } else {
                showAuthView();
            }
        }
        checkSession();

        // =========================================================================
        // 3. Ação de Login
        // =========================================================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Fazer autenticação no Supabase
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMessage.textContent = 'Erro ao entrar: ' + error.message;
                errorMessage.style.display = 'block';
            } else {
                showAppView(data.user.email);
            }
        });

        // =========================================================================
        // 4. Ação de Logout
        // =========================================================================
        logoutBtn.addEventListener('click', async () => {
            await _supabase.auth.signOut();
            showAuthView();
        });
    </script>

</body>
</html>
