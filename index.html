<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Final ME315</title>

    <!-- SDK oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #fbf9f5;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
            --text-muted: #8c8c8c;
            --accent-green: #a8c3b2;
            --accent-green-hover: #96b3a0;
            --accent-pink: #f4dcd6;
            --border-color: #eee9e0;
            --error-color: #c65f65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        }

        .app-card { max-width: 600px; }

        h1, h2, h3 {
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #faf9f6;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent-green); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-green);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--accent-green-hover); }
        .btn:disabled { opacity: 0.65; cursor: wait; }

        .btn-secondary {
            background-color: var(--accent-pink);
            color: var(--text-main);
        }

        .form-actions {
            display: grid;
            gap: 10px;
        }

        .message {
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .error-message { color: var(--error-color); }
        .status-message { color: #4d8063; }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .app-header h2 { margin-bottom: 0; }

        .badge {
            background-color: var(--accent-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .content-box {
            background-color: #faf9f6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 480px) {
            .card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <section id="authView" class="card">
        <h2>Bem-vindo</h2>
        <p>Entre com sua conta ou crie uma nova.</p>

        <div id="errorMessage" class="message error-message hidden" role="alert"></div>
        <div id="statusMessage" class="message status-message hidden" role="status" aria-live="polite"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="Sua senha" required>
            </div>

            <div class="form-actions">
                <button id="loginBtn" type="submit" class="btn">Entrar</button>
                <button id="signupBtn" type="button" class="btn btn-secondary">Criar conta</button>
            </div>
        </form>
    </section>

    <main id="appView" class="card app-card hidden">
        <div class="app-header">
            <div>
                <h2>Painel Principal</h2>
                <span class="badge">Online</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary" style="width: auto; padding: 6px 16px;">Sair</button>
        </div>

        <div class="content-box">
            <h3>Login realizado com sucesso!</h3>
            <p style="margin-bottom: 0; margin-top: 8px;">Conectado como: <strong id="userEmail">...</strong></p>
        </div>
    </main>

    <script>
        // Use a URL e a chave pública (publishable/anon) do mesmo projeto Supabase.
        const SUPABASE_URL = 'https://sikucdacxktouklgqpeu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Y_KwtD9Oba1u3a7RoBa8sg_HBAdjge2';

        const authView = document.getElementById('authView');
        const appView = document.getElementById('appView');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const errorMessage = document.getElementById('errorMessage');
        const statusMessage = document.getElementById('statusMessage');
        const userEmailSpan = document.getElementById('userEmail');

        function showMessage(element, message) {
            element.textContent = message;
            element.classList.remove('hidden');
        }

        function clearMessages() {
            errorMessage.textContent = '';
            statusMessage.textContent = '';
            errorMessage.classList.add('hidden');
            statusMessage.classList.add('hidden');
        }

        function showAppView(email) {
            userEmailSpan.textContent = email || 'Conta autenticada';
            authView.classList.add('hidden');
            appView.classList.remove('hidden');
        }

        function showAuthView() {
            appView.classList.add('hidden');
            authView.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            signupBtn.disabled = isLoading;
            logoutBtn.disabled = isLoading;
            loginBtn.textContent = isLoading ? 'Aguarde...' : 'Entrar';
        }

        let supabaseClient;

        try {
            if (!window.supabase?.createClient) {
                throw new Error('O SDK do Supabase não carregou. Verifique sua conexão e atualize a página.');
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (error) {
            showMessage(errorMessage, error.message);
        }

        if (supabaseClient) {
            // Atualiza a tela quando a autenticação muda (login, logout ou sessão restaurada).
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session?.user) {
                    showAppView(session.user.email);
                } else if (event === 'SIGNED_OUT') {
                    showAuthView();
                }
            });

            async function checkSession() {
                try {
                    const { data, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    if (data.session?.user) showAppView(data.session.user.email);
                    else showAuthView();
                } catch (error) {
                    showAuthView();
                    showMessage(errorMessage, 'Não foi possível verificar a sessão: ' + error.message);
                }
            }

            checkSession();

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                clearMessages();
                setLoading(true);

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    // A mudança de estado de autenticação mostra o painel.
                } catch (error) {
                    showMessage(errorMessage, 'Erro ao entrar: ' + error.message);
                } finally {
                    setLoading(false);
                }
            });

            signupBtn.addEventListener('click', async () => {
                clearMessages();
                if (!loginForm.reportValidity()) return;
                setLoading(true);

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;

                    if (data.session) {
                        showAppView(data.user?.email);
                    } else {
                        showMessage(statusMessage, 'Cadastro enviado. Confira seu e-mail para confirmar a conta antes de entrar.');
                    }
                } catch (error) {
                    showMessage(errorMessage, 'Erro ao criar conta: ' + error.message);
                } finally {
                    setLoading(false);
                }
            });

            logoutBtn.addEventListener('click', async () => {
                clearMessages();
                setLoading(true);

                try {
                    const { error } = await supabaseClient.auth.signOut();
                    if (error) throw error;
                    showAuthView();
                } catch (error) {
                    showMessage(errorMessage, 'Erro ao sair: ' + error.message);
                } finally {
                    setLoading(false);
                }
            });
        }
    </script>
</body>
</html>
